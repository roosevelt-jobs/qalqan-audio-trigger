# Обучение модели A (KWS). Набор — configs/data.yaml (S11b).
kws:
  manifest: data/processed/kws/manifest.jsonl
  out_dir: models/kws
  name: kws_dscnn_v1
  seed: 0
  classes: [other, na_pomosh, komektesinder]   # индекс 1 — ru, 2 — kk
  class_of_lang: {ru: 1, kk: 2}
  # ASSUMPTION: позитив сдвигается в окне на 0–0,5 с — детектор видит фразу в разных местах окна.
  positive_max_offset_sec: 0.5
  model: {channels: 64, blocks: 4}
  epochs: 30
  batch_size: 256
  lr: 0.002
  weight_decay: 0.001
  label_smoothing: 0.05
  specaugment: {time_mask: 20, freq_mask: 6}
  score_threshold: 0.5   # для отчёта: доля негативов validation с оценкой выше порога
