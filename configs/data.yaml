# Данные для модели A (KWS). CLAUDE.md, раздел 7: пути и версии датасетов — здесь.
kws:
  out_dir: data/processed/kws
  seed: 0

  # Кодовые фразы (S15: MVP на английском; RU/KK — см. историю git, коммит f3bd75d).
  phrases:
    en: ["help"]

  # Тексты для синтеза позитивов.
  positive_texts:
    en: ["Help!", "help", "Help! Help!", "Help, help!"]

  # Трудные негативы: звучат похоже на «help», но это другие слова.
  # ASSUMPTION: фразы со словом «help» внутри предложения («Thanks for the help») НЕ берём в
  # негативы: на окне ~1 с они акустически неотличимы от позитива, и метки противоречили бы
  # друг другу. Это ограничение A и C — различать контекст должен оператор.
  # Синтез проверяется Vosk: негатив, распознанный как «help», отбраковывается.
  hard_negative_texts:
    en:
      - "Yelp!"
      - "Hello!"
      - "Hell no."
      - "Whelp, that's that."
      - "The kelp is on the shelf."
      - "Put on your helmet."
      - "Health and safety."
      - "He held it."
      - "Yell if you need me."
      - "Hold on!"
      - "Hey, over here!"
      - "Hello, how are you?"

  # Обычная синтетическая речь (теми же голосами): предложения из расшифровок FLEURS.
  negative_sentences:
    source: data/census/fleurs  # google/fleurs@70bb2e84b976b7e960aa89f1c648e09c59f894dd, *.tsv
    per_voice: 20

  # Голоса Piper: rhasspy/piper-voices@5041a7a49ae5b3a0f30e6837769eb03fdbb231bd
  voices_dir: models/piper
  # speakers: id диктора в модели -> человек (из speaker_id_map в .onnx.json).
  # libritts-high: 20 из 904 дикторов (каждый 45-й по индексу), чтобы не привыкнуть к 3–4 голосам.
  voices:
    - {name: en_US-libritts-high, lang: en, license: CC-BY-4.0,
       speakers: {0: lt_p3922, 45: lt_p534, 90: lt_p6694, 135: lt_p8527, 180: lt_p1509, 225: lt_p6098, 270: lt_p3032, 315: lt_p7959, 360: lt_p5519, 405: lt_p8138, 450: lt_p7384, 495: lt_p3289, 540: lt_p3221, 585: lt_p6167, 630: lt_p5115, 675: lt_p4057, 720: lt_p1160, 765: lt_p1668, 810: lt_p3790, 855: lt_p4236}}
    - {name: en_US-john-medium, lang: en, license: public-domain, speakers: {0: en_john}}
    - {name: en_US-kristin-medium, lang: en, license: public-domain, speakers: {0: en_kristin}}
    - {name: en_US-bryce-medium, lang: en, license: public-domain, speakers: {0: en_bryce}}
    - {name: en_US-joe-medium, lang: en, license: CC0, speakers: {0: en_joe}}
  # Люди, целиком отложенные для проверки при обучении (validation), — не в train.
  val_speakers: [lt_p3922, lt_p6098, lt_p7384, lt_p4057, en_joe]

  # Вариации интонации Piper (length_scale — темп, noise_scale — вариативность звучания).
  prosody:
    length_scale: [0.85, 1.0, 1.2]
    noise_scale: [0.4, 0.667, 0.9]
    noise_w_scale: 0.8

  # Живые негативы.
  kscd:  # issai/kazakh-speech-commands, MIT
    archive: data/kscd/data.zip
    val_speaker_fraction: 0.1
  fsd50k:  # уже подготовленный FSD50K eval 16 кГц (S11a)
    clips_dir: data/processed/fsd50k_eval
    manifest: data/processed/fsd50k_eval/manifest_sed_neg3000_seed0.jsonl
    negatives_as_clips: 600  # речь и звуки — негативы
    val_group_fraction: 0.1

  # Короткий путь ради демо (решение пользователя): меньше копий, один прогон.
  augment:
    copies_positive: 6
    copies_negative: 1
