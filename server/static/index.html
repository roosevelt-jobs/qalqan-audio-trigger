<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qalqan — оператор</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --text: #1d2330; --muted: #667085; --border: #d0d5dd;
    --alarm: #d92d20; --alarm-bg: #fef3f2; --ok: #079455; --ok-bg: #ecfdf3; --rej: #475467;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c; --card: #1c212b; --text: #e4e7ec; --muted: #98a2b3; --border: #344054;
      --alarm: #f97066; --alarm-bg: #3a1a18; --ok: #47cd89; --ok-bg: #11301f; --rej: #98a2b3;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px;
           padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--card); }
  h1 { font-size: 18px; margin: 0; }
  #conn { font-size: 13px; color: var(--muted); }
  #conn.on::before { content: "● "; color: var(--ok); }
  #conn.off::before { content: "● "; color: var(--alarm); }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  #empty { color: var(--muted); text-align: center; padding: 48px 0; }
  .card { background: var(--card); border: 1px solid var(--border); border-left: 6px solid var(--alarm);
          border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
  .card.new { animation: flash 1s ease-in-out 3; }
  @keyframes flash { 50% { background: var(--alarm-bg); } }
  .card.confirmed { border-left-color: var(--ok); }
  .card.rejected { border-left-color: var(--rej); opacity: .75; }
  .row { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; }
  .title { font-weight: 600; font-size: 16px; }
  .meta { color: var(--muted); font-size: 13px; }
  audio { width: 100%; margin-top: 8px; }
  .pending { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .actions { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--border);
           background: var(--card); color: var(--text); cursor: pointer; }
  button.confirm { background: var(--ok); border-color: var(--ok); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .decision { font-weight: 600; }
  .decision.confirmed { color: var(--ok); }
  .decision.rejected { color: var(--rej); }
</style>
</head>
<body>
<header>
  <h1>Qalqan — тревоги</h1>
  <span id="conn" class="off">нет связи</span>
</header>
<main>
  <div id="empty">Тревог пока нет</div>
  <div id="list"></div>
</main>
<script>
const list = document.getElementById("list");
const empty = document.getElementById("empty");
const conn = document.getElementById("conn");
const cards = new Map();  // event_id -> {el, seenAt}

const DECISION_TEXT = { confirmed: "Подтверждено", rejected: "Отклонено" };
const DETECTOR_TEXT = {
  asr_keywords: "кодовая фраза (C)",
  sed_panns: "крик (B)",
  energy: "громкость (заглушка)",
};

function detectorText(name) {
  // несколько детекторов в одной тревоге — через «+»
  return name.split("+").map(n => DETECTOR_TEXT[n] || n).join(" + ");
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function render(ev, isLive) {
  let entry = cards.get(ev.event_id);
  if (!entry) {
    // Задержка: срабатывание (timestamp_utc) -> первое появление на экране. Только для живых событий.
    const latency = isLive ? Date.now() - Date.parse(ev.timestamp_utc) : null;
    entry = { el: el("div", "card"), latency };
    cards.set(ev.event_id, entry);
    list.prepend(entry.el);
    if (isLive) entry.el.classList.add("new");
  }
  empty.hidden = cards.size > 0;

  const card = entry.el;
  card.classList.toggle("confirmed", ev.operator_decision === "confirmed");
  card.classList.toggle("rejected", ev.operator_decision === "rejected");
  card.replaceChildren();

  const head = el("div", "row");
  head.append(el("span", "title", "Тревога: " + detectorText(ev.detector)));
  head.append(el("span", "meta", new Date(ev.timestamp_utc).toLocaleTimeString("ru-RU")));
  head.append(el("span", "meta",
    "уверенность " + ev.score.toFixed(2) + " (порог " + ev.threshold.toFixed(2) + ")"));
  if (entry.latency !== null) head.append(el("span", "meta", "задержка " + entry.latency + " мс"));
  card.append(head);

  if (ev.clip_path) {
    const audio = el("audio");
    audio.controls = true;
    audio.preload = "none";
    audio.src = "/clips/" + ev.event_id + ".wav";
    card.append(audio);
    const off = el("div", "meta",
      "клип " + ev.clip_start_offset_sec.toFixed(1) + " … +" + ev.clip_end_offset_sec.toFixed(1) +
      " с, SHA-256 " + ev.clip_sha256.slice(0, 12) + "…");
    card.append(off);
  } else {
    card.append(el("div", "pending", "Клип записывается…"));
  }

  const actions = el("div", "actions");
  if (ev.operator_decision) {
    actions.append(el("span", "decision " + ev.operator_decision, DECISION_TEXT[ev.operator_decision]));
  } else {
    const yes = el("button", "confirm", "Подтвердить");
    const no = el("button", "", "Отклонить");
    yes.onclick = () => decide(ev.event_id, "confirmed", [yes, no]);
    no.onclick = () => decide(ev.event_id, "rejected", [yes, no]);
    actions.append(yes, no);
  }
  card.append(actions);
}

async function decide(id, decision, buttons) {
  buttons.forEach(b => b.disabled = true);
  try {
    const r = await fetch("/events/" + id + "/decision", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ decision }),
    });
    if (!r.ok) throw new Error(r.status);
  } catch (e) {
    buttons.forEach(b => b.disabled = false);
    alert("Не удалось сохранить решение: " + e.message);
  }
}

function connect() {
  const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.onopen = () => { conn.className = "on"; conn.textContent = "на связи"; };
  ws.onmessage = (m) => {
    const msg = JSON.parse(m.data);
    if (msg.type === "history") msg.events.forEach(ev => render(ev, false));
    else if (msg.type === "event") render(msg.event, true);
  };
  ws.onclose = () => {
    conn.className = "off"; conn.textContent = "нет связи, переподключение…";
    setTimeout(connect, 1000);
  };
}
connect();
</script>
</body>
</html>
